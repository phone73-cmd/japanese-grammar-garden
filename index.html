function frame(body){app.innerHTML=`<main class="shell"><header><div class="brand"><div class="flower">🌸</div><div><b>일본어 문법정원</b><small>매일 하나씩 배우는 일본어</small></div></div><span class="ver">v${VERSION}</span></header>${body}</main><nav class="nav">${[["home","⌂ 홈"],["lessons","▤ 학습"],["review","↻ 오답"],["settings","⚙ 설정"]].map(([id,label])=>`<button data-action="nav:${id}" class="${view===id?"active":""}">${label}</button>`).join("")}</nav>`;}
function home(){const done=[1,6,7].filter(id=>best(id)>=80).length;frame(`<section class="card hero"><small>일본어 문법정원 · 첫 공개 개발본</small><h2>일본어를 한 걸음씩 🌱</h2><p>설명을 읽고 예문을 익힌 다음 문제로 확인해 보세요.</p>${btn("학습 시작하기","nav:lessons","primary")}</section><div class="grid"><button class="tile" data-action="nav:lessons">📖<strong>문법 배우기</strong><span>6단계 · 60단원 목록</span></button><button class="tile" data-action="lesson:1">🧩<strong>문제 풀기</strong><span>학습과 연결된 퀴즈</span></button><button class="tile" data-action="nav:review">🔁<strong>오답 복습</strong><span>틀린 개념 다시 보기</span></button><button class="tile" data-action="nav:settings">💾<strong>백업·설정</strong><span>기기별 기록 보호</span></button></div><section class="card"><strong>학습 기록</strong><div class="stats"><div><strong>${done}</strong><small>완료 단원</small></div><div><strong>${state.attempts.length}</strong><small>시험 횟수</small></div><div><strong>${state.review.length}</strong><small>오답 기록</small></div></div></section><p class="warning">현재 실제 수업과 문제는 1·6·7과에만 제공됩니다. 나머지 57단원은 준비 중이며 아직 학습할 수 없습니다.</p>`);}
function lessons(){frame(`<section class="card"><h2>단계별 학습</h2><p class="muted">학습 순서는 추천일 뿐 잠금이 없습니다. 작성되지 않은 단원은 준비 중입니다.</p><select id="stage" aria-label="학습 단계">${stageNames.map((n,i)=>`<option value="${i}" ${stage===i?"selected":""}>${i+1}단계 · ${esc(n)}</option>`).join("")}</select>${titles.slice(stage*10,stage*10+10).map((title,i)=>{const id=stage*10+i+1,ready=!!content[id];return `<button class="listrow" data-action="lesson:${id}" ${ready?"":"disabled"}><span>${String(id).padStart(2,"0")}과 · ${esc(title)}</span><span class="pill ${ready?"":"pending"}">${ready?(best(id)>=80?"완료":best(id)?best(id)+"점":"학습 가능"):"준비 중"}</span></button>`}).join("")}</section>`);}
function lesson(){const d=content[lessonId];if(!d){go("lessons");return}frame(`<section class="card"><small>${Math.ceil(lessonId/10)}단계 · ${lessonId}과</small><h2>${esc(titles[lessonId-1])}</h2><p><b>학습 목표</b> · ${esc(d.goal)}</p><div class="example">${esc(d.explain)}</div><h3>예문 듣고 익히기</h3>${d.examples.map((e,i)=>`<div class="example"><div class="row"><span class="jp" lang="ja">${esc(e[0])}</span>${btn("🔊","speak:"+i)}</div>${state.settings.reading?`<div class="small">${esc(e[1])}</div>`:""}${state.settings.romaji?`<div class="small muted">${esc(e[2])}</div>`:""}${state.settings.meaning?`<p>${esc(e[3])}</p>`:""}</div>`).join("")}<div class="btnrow">${btn("단원 선택","nav:lessons")}${quiz&&quiz.lessonId===lessonId?btn("이어서 풀기","quiz:resume","primary"):""}${btn("10문제 풀기","quiz:start","primary")}</div></section>`);}
function start(){const count=content[lessonId].questions.length;quiz={lessonId,pos:0,answers:[],order:Array.from({length:count},(_,i)=>i)};for(let i=count-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[quiz.order[i],quiz.order[j]]=[quiz.order[j],quiz.order[i]]}view="quiz";history.pushState({view,lessonId,stage},"","#quiz");persist();showQuiz();}
function showQuiz(){const q=content[lessonId].questions[quiz.order[quiz.pos]],answer=quiz.answers[quiz.pos];persist();frame(`<section class="card"><div class="row"><strong>${esc(titles[lessonId-1])} · 단원 시험</strong><small>${quiz.pos+1} / ${quiz.order.length}</small></div><div class="progress" style="margin:15px 0"><div style="width:${100*(quiz.pos+1)/quiz.order.length}%"></div></div><h3>${esc(q.question)}</h3><div class="options">${q.choices.map((s,i)=>`<button class="answer ${answer!==undefined?(i===q.correct?"correct":i===answer?"wrong":""):""}" data-action="answer:${i}" ${answer!==undefined?"disabled":""}>${"ABCD"[i]}. ${esc(s)}</button>`).join("")}</div>${answer!==undefined?`<div class="feedback"><strong>${answer===q.correct?"정답입니다! 🎉":"다시 익혀봐요"}</strong><p>${esc(q.reason)}</p></div><div class="btnrow">${btn(quiz.pos+1===quiz.order.length?"결과 보기":"다음 문제","quiz:next","primary")}</div>`:""}</section>`);}
function finish(){const d=content[lessonId],correct=quiz.answers.filter((a,i)=>a===d.questions[quiz.order[i]].correct).length,score=correct*10,at=new Date().toISOString();state.attempts.push({lessonId,score,correct,total:10,at});quiz.answers.forEach((a,i)=>{const qi=quiz.order[i];if(a!==d.questions[qi].correct)state.review.push({lessonId,questionIndex:qi,at})});save();lastResult={lessonId,score,correct};quiz=null;view="result";history.pushState({view,lessonId,stage},"","#result");persist();showResult()}
function showResult(){const {score,correct}=lastResult;frame(`<section class="card"><h2>단원 시험 결과</h2><div class="stats"><div><strong>${score}점</strong><small>이번 점수</small></div><div><strong>${correct}/10</strong><small>정답</small></div><div><strong>${best(lessonId)}점</strong><small>최고 점수</small></div></div><p>${score>=80?"🎉 80점 이상으로 단원을 완료했습니다!":"오답을 복습한 후 다시 도전해 보세요."}</p><div class="btnrow">${btn("학습 다시 보기","lesson:"+lessonId)}${btn("다시 풀기","quiz:start","primary")}</div></section>`);}
function review(){frame(`<section class="card"><h2>오답 복습</h2><p class="muted">틀렸던 문제와 해설을 다시 확인하세요. 간격 반복 스케줄은 후속 개발 예정입니다.</p>${state.review.length?state.review.slice(-100).reverse().map(r=>{const q=content[r.lessonId]?.questions[r.questionIndex];return q?`<div class="example"><small>${esc(titles[r.lessonId-1])} · ${esc((r.at||"").slice(0,10))}</small><p><b>${esc(q.question)}</b></p><p>정답: ${esc(q.choices[q.correct])}</p><p class="muted">${esc(q.reason)}</p>${btn("관련 단원 보기","lesson:"+r.lessonId)}</div>`:""}).join(""):"<p>아직 오답 기록이 없습니다.</p>"}</section>`);}
function settings(){frame(`<section class="card"><h2>화면 모드</h2>${[["light","☀ 라이트 모드"],["dark","☾ 다크 모드"],["system","▣ 기기 설정"]].map(([v,n])=>`<label class="theme-choice"><input type="radio" name="theme" value="${v}" ${(state.settings.theme||"system")===v?"checked":""}> ${n}</label>`).join("")}</section><section class="card"><h2>학습 표시 설정</h2>${[["reading","히라가나 표시"],["romaji","로마자 표시"],["meaning","한국어 뜻 표시"]].map(([k,label])=>`<label class="listrow">${label}<input type="checkbox" data-setting="${k}" ${state.settings[k]?"checked":""}></label>`).join("")}</section><section class="card"><h2>기록 백업·복원</h2><p class="muted">학습 기록은 이 브라우저에 저장됩니다. 기기를 옮길 때는 JSON 파일을 이용하세요.</p><div class="backup-actions"><button class="primary" data-action="export">JSON 내보내기</button><label class="secondary backup-upload">JSON 가져오기<input id="import" type="file" accept=".json,application/json" class="hidden"></label></div><p class="warning">복원하면 현재 기록이 교체됩니다. 복원 전에 백업하세요.</p></section><section class="card"><h2>개발 정보</h2><p>v${VERSION} · 첫 공개 개발본</p><p class="muted">Firebase·Google 로그인 없음. 현재 기록은 localStorage이며 IndexedDB 전환은 후속 버전에서 진행합니다.</p></section>`);}
function render(){({home,lessons,lesson,quiz:showQuiz,result:showResult,review,settings}[view]||home)()}
function go(v){if(view==="quiz"&&v!=="quiz"&&!confirm("문제 풀이를 중단할까요? 진행 상태가 저장됩니다."))return;view=v;history.pushState({view,lessonId,stage},"","#"+view);persist();render();scrollTo(0,0)}
app.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a.startsWith("nav:"))go(a.slice(4));else if(a.startsWith("lesson:")){lessonId=Number(a.slice(7));go("lesson")}else if(a==="quiz:start"){if(quiz&&quiz.lessonId===lessonId&&!confirm("기존 시험을 다시 시작할까요?"))return;start()}else if(a==="quiz:resume"&&quiz){view="quiz";history.pushState({view,lessonId,stage},"","#quiz");persist();showQuiz()}else if(a.startsWith("answer:")&&quiz&&quiz.answers[quiz.pos]===undefined){quiz.answers[quiz.pos]=Number(a.slice(7));persist();showQuiz()}else if(a==="quiz:next"&&quiz){if(quiz.pos===quiz.order.length-1)finish();else{quiz.pos++;persist();showQuiz()}}else if(a.startsWith("speak:")){const phrase=content[lessonId].examples[Number(a.slice(6))][0];if("speechSynthesis"in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(phrase);u.lang="ja-JP";u.rate=.85;speechSynthesis.speak(u)}else alert("기기에서 일본어 음성을 지원하지 않습니다.")}else if(a==="export"){const data={app:"japanese-grammar-garden",schema:1,exportedAt:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="japanese-grammar-garden-backup.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}});
app.addEventListener("change",async e=>{if(e.target.id==="stage"){stage=Number(e.target.value);persist();lessons()}else if(e.target.name==="theme"){state.settings.theme=e.target.value;save();setTheme()}else if(e.target.dataset.setting){state.settings[e.target.dataset.setting]=e.target.checked;save()}else if(e.target.id==="import"){const file=e.target.files?.[0];if(!file)return;try{if(file.size>2000000)throw Error("파일 크기 초과");const obj=JSON.parse(await file.text());if(obj.app!=="japanese-grammar-garden"||obj.schema!==1||!obj.data||!Array.isArray(obj.data.attempts)||!Array.isArray(obj.data.review)||obj.data.attempts.length>100000||obj.data.review.length>100000)throw Error("잘못된 백업 형식");if(!confirm("기존 기록을 백업 내용으로 교체할까요?"))return;const src=obj.data;state={attempts:src.attempts.filter(x=>[1,6,7].includes(x.lessonId)&&Number.isFinite(x.score)),review:src.review.filter(x=>[1,6,7].includes(x.lessonId)&&Number.isInteger(x.questionIndex)&&x.questionIndex>=0&&x.questionIndex<10),settings:{reading:src.settings?.reading??src.settings?.showReading??true,romaji:src.settings?.romaji??src.settings?.showRomaji??true,meaning:src.settings?.meaning??src.settings?.showMeaning??true,theme:["light","dark","system"].includes(src.settings?.theme)?src.settings.theme:"system"}};save();setTheme();alert("복원이 완료되었습니다.");settings()}catch(err){alert("복원 실패: "+err.message)}finally{e.target.value=""}}});
function persist(){try{sessionStorage.setItem(SESSION,JSON.stringify({view,lessonId,stage,quiz,lastResult}))}catch(e){console.warn(e)}}
try{const p=JSON.parse(sessionStorage.getItem(SESSION)||"null");if(p&&["home","lessons","lesson","quiz","result","review","settings"].includes(p.view)){view=p.view;lessonId=[1,6,7].includes(p.lessonId)?p.lessonId:1;stage=Number.isInteger(p.stage)&&p.stage>=0&&p.stage<6?p.stage:0;quiz=p.quiz&&p.quiz.lessonId===lessonId&&Array.isArray(p.quiz.order)&&p.quiz.order.length===10&&Array.isArray(p.quiz.answers)&&Number.isInteger(p.quiz.pos)&&p.quiz.pos>=0&&p.quiz.pos<10?p.quiz:null;lastResult=p.lastResult||null;if(view==="quiz"&&!quiz)view="lesson";if(view==="result"&&!lastResult)view="lesson"}}catch(e){console.warn(e)}
if(history.state&&["home","lessons","lesson","quiz","result","review","settings"].includes(history.state.view)){view=history.state.view;lessonId=[1,6,7].includes(history.state.lessonId)?history.state.lessonId:lessonId;stage=Number.isInteger(history.state.stage)?history.state.stage:stage;if(view==="quiz"&&!quiz)view="lesson";if(view==="result"&&!lastResult)view="lesson"}history.replaceState({view,lessonId,stage},"","#"+view);persist();
let ignoredPop=false;window.addEventListener("popstate",e=>{if(ignoredPop){ignoredPop=false;return}const h=e.state||{view:"home",lessonId,stage};if(!["home","lessons","lesson","quiz","result","review","settings"].includes(h.view))return;if(view==="quiz"&&(h.view!=="quiz"||h.lessonId!==lessonId)&&!confirm("문제 풀이를 중단할까요? 진행 상태가 저장됩니다.")){ignoredPop=true;history.go(1);return}view=h.view;lessonId=[1,6,7].includes(h.lessonId)?h.lessonId:lessonId;stage=Number.isInteger(h.stage)&&h.stage>=0&&h.stage<6?h.stage:stage;if(view==="quiz"&&!quiz)view="lesson";if(view==="result"&&!lastResult)view="lesson";persist();render();scrollTo(0,0)});
const pull=document.createElement("div");pull.id="pull-indicator";pull.setAttribute("aria-live","polite");document.body.append(pull);let sy=null,dist=0;
document.addEventListener("touchstart",e=>{sy=e.touches.length===1&&scrollY<=1?e.touches[0].clientY:null;dist=0},{passive:true});
document.addEventListener("touchmove",e=>{if(sy===null||e.touches.length!==1)return;const d=e.touches[0].clientY-sy;if(d<=15||scrollY>1){pull.className="";return}dist=d;pull.className="visible";pull.textContent=d>=120?"↻ 놓으면 새로고침":"↓ 아래로 당겨 새로고침";pull.style.transform="translate(-50%,"+(Math.min(d/2,65)+65)+"px)";if(e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener("touchend",()=>{if(dist>=120){pull.textContent="↻ 새로고침 중";persist();location.reload()}else{pull.className="";pull.style.transform=""}sy=null;dist=0},{passive:true});
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(console.warn));render();
</script></body></html>
